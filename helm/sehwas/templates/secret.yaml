{{- if .Values.turn.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sehwas.fullname" . }}-turn
  labels:
    {{- include "sehwas.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ required "turn.url is required when turn.enabled=true" .Values.turn.url | quote }}
  username: {{ required "turn.username is required when turn.enabled=true" .Values.turn.username | quote }}
  credential: {{ required "turn.credential is required when turn.enabled=true" .Values.turn.credential | quote }}
{{- end }}
