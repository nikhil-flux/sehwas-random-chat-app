apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sehwas.fullname" . }}
  labels:
    {{- include "sehwas.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "sehwas.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sehwas.selectorLabels" . | nindent 8 }}
      {{- if .Values.turn.enabled }}
      annotations:
        checksum/turn-secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.turn.enabled }}
            - name: TURN_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "sehwas.fullname" . }}-turn
                  key: url
            - name: TURN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "sehwas.fullname" . }}-turn
                  key: username
            - name: TURN_CREDENTIAL
              valueFrom:
                secretKeyRef:
                  name: {{ include "sehwas.fullname" . }}-turn
                  key: credential
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
