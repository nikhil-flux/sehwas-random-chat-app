apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sehwas-dev
  namespace: argocd
spec:
  project: sehwas
  source:
    repoURL: https://github.com/nikhil-flux/sehwas-random-chat-app.git
    targetRevision: main
    path: helm/sehwas
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sehwas-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
